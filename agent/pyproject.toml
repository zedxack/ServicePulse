[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicepulse-agent"
version = "1.0.0"
description = "ServicePulse Native Windows Monitoring and Remediation Agent"
authors = [
    { name = "Muhammadyusuf Usmonov", email = "author@servicepulse.uz" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "psutil>=7.0.0",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
servicepulse-agent = "servicepulse_agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["servicepulse*"]
